<!DOCTYPE html>
<html lang="en">
<head>
<meta name="specbook-reader" content="1.0.0">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spec Book</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/r/1.0.0/book.css?h=0a216b09d4df">
</head>
<body>
<header class="bar" role="toolbar" aria-label="Design bar">
  <strong id="book-title" class="bar-title">Spec book</strong>
  <div class="seg3 view-switch" role="group" aria-label="Book or screens"><button type="button" id="to-book" aria-pressed="true">Book</button><button type="button" id="to-screens" aria-pressed="false">Screens</button></div>
  <div class="menu-wrap view-wrap">
    <button type="button" id="view-btn" class="bar-btn ghost" aria-expanded="false" aria-controls="view-menu" title="What the book shows">View<span class="chev" aria-hidden="true"><svg viewBox="0 0 24 24" width="18" height="18"><path d="M6 9l6 6 6-6"/></svg></span></button>
    <div id="view-menu" class="bar-menu" hidden>
      <p class="bar-menu-head">Show in the book</p>
      <label class="check"><input type="checkbox" id="view-mock" checked> Mockups</label>
      <label class="check"><input type="checkbox" id="view-shot"> Screenshots</label>
      <label class="check"><input type="checkbox" id="show-videos" checked> Recordings</label>
      <label class="check" id="coverage-group" title="Dim requirements with no passing test" hidden><input type="checkbox" id="show-coverage"> Coverage</label>
      <label class="check" id="sent-toggle" title="Draw the pins of notes already sent to Claude, read-only" hidden><input type="checkbox" id="show-sent"> Show sent notes</label>
      <p class="bar-hint" id="media-count"></p>
      <span class="bar-hint" id="since" hidden></span>
    </div>
  </div>
  <div class="bar-spacer"></div>
  <div id="share-slot"></div>
  <div class="menu-wrap bar-group claude" id="claude-menu">
    <button type="button" id="claude-btn" class="claude-btn" aria-expanded="false" aria-controls="claude-pop"><svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path d="M12 2l1.8 6.2L20 10l-6.2 1.8L12 18l-1.8-6.2L4 10l6.2-1.8z"/></svg><span>Claude</span><span id="claude-busy" class="claude-busy"></span><span id="claude-count" class="tool-badge claude-count" hidden>0</span><span class="chev" aria-hidden="true"><svg viewBox="0 0 24 24" width="18" height="18"><path d="M6 9l6 6 6-6"/></svg></span></button>
    <div id="claude-pop" class="bar-menu claude-pop" hidden>
      <div id="revise-row" class="claude-row"><button type="button" id="revise" class="claude-act"><span class="ca-label">Revise</span><small>Review your notes, then send them. Claude revises the book and you review each change.</small></button><button type="button" class="claude-stop" aria-label="Stop revising" hidden><span class="ca-sq" aria-hidden="true"></span>Stop</button></div>
      <div id="build-row" class="claude-row"><button type="button" id="build" class="claude-act"><span class="ca-label">Build</span><small>Build the sections marked Ready, with tests as evidence.</small></button><button type="button" class="claude-stop" aria-label="Stop the build" hidden><span class="ca-sq" aria-hidden="true"></span>Stop</button></div>
      <div id="claude-ask" class="claude-ask" role="group" aria-labelledby="ca-title" hidden><p id="ca-title"></p><small class="ca-body"></small><div class="ca-row"><button type="button" class="bar-btn ca-keep">Keep going</button><button type="button" class="ca-stop"></button></div></div>
      <p id="claude-status" class="bar-hint"></p>
    </div>
  </div>
</header>
<div id="build-banner" class="build-banner" role="status" hidden></div>
<div class="layout">
  <nav class="side" id="toc-nav" aria-label="Contents"><div id="toc"></div></nav>
  <div id="toc-backdrop" class="toc-backdrop" hidden></div>
  <main id="main"><p class="loading">Loading the book…</p></main>
</div>
<div class="tools" id="review-tools" role="group" aria-label="Review">
  <button type="button" id="toc-btn" class="tool" aria-expanded="false" aria-controls="toc-nav" title="Contents" aria-label="Contents"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg></button>
  <span class="tool-sep" aria-hidden="true"></span>
  <button type="button" id="mode" class="tool tool-cmt" aria-pressed="false" aria-keyshortcuts="C" title="Comment · C" aria-label="Comment (C): click the book to drop a note"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M3 21V12a9 9 0 1 1 9 9z"/></svg></button>
  <span class="tool-sep" aria-hidden="true"></span>
  <button type="button" id="prev-chg" class="tool" aria-keyshortcuts="K" title="Previous change · K" aria-label="Previous change (K)"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M6 15l6-6 6 6"/></svg></button>
  <span id="chg-pos" class="tool-pos" aria-live="polite">0 / 0</span>
  <button type="button" id="next-chg" class="tool" aria-keyshortcuts="J" title="Next change · J" aria-label="Next change (J)"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button>
  <button type="button" id="changes-btn" class="tool" aria-pressed="false" aria-keyshortcuts="F" title="Only what needs you · F" aria-label="Only what needs you (F): changes not accepted yet and notes"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M3 5h18l-7 8v6l-4-2v-4z"/></svg></button>
</div>
<aside id="review-panel" class="notes-panel review-panel" aria-labelledby="rp-title" tabindex="-1" hidden>
  <div class="np-head"><h2 id="rp-title">Review calls</h2><button type="button" id="rp-close" class="np-x" aria-label="Close review">×</button></div>
  <p class="np-empty">Calls the build made on its own. Accept one to keep it as a decision, or reject it with what you want instead.</p>
  <ol id="rp-list" class="np-list"></ol>
</aside>
<div id="cc-backdrop" class="cc-backdrop" hidden></div>
<div id="claude-confirm" class="cc" role="dialog" aria-modal="true" aria-labelledby="cc-title" hidden>
  <div class="cc-head"><h2 id="cc-title"></h2><p class="cc-sub"></p></div>
  <div class="cc-list"></div>
  <div class="cc-foot"><button type="button" class="bar-btn cc-cancel">Cancel</button><button type="button" class="cc-send">✦ Send to Claude</button></div>
</div>
<p class="bar-msg" id="make-msg" role="status" title="Click to dismiss"></p>
<textarea id="out" aria-label="Requests" class="out"></textarea>
<script src="/r/1.0.0/relay.js?h=3508d4a1488a"></script>
<script src="/r/1.0.0/share.js?h=3bd51622a829"></script>
<script src="/r/1.0.0/model.js?h=aa6047eeef06"></script>
<script src="/r/1.0.0/book.js?h=8f4bf08e6ae7"></script>
<script src="/r/1.0.0/live.js?h=6ce0ded70b06"></script>
</body>
</html>
