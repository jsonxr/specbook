<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Spec book</title>
<style>
  .share-boot { font: 400 15px/1.45 system-ui, -apple-system, 'Segoe UI', sans-serif; color: #222; display: grid; place-items: center; min-height: 80vh; padding: 16px; }
  .share-join { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; background: rgba(20, 20, 24, .45); }
  .share-join form { width: min(360px, calc(100vw - 32px)); padding: 22px; border-radius: 14px; background: #fff; box-shadow: 0 12px 40px rgba(0,0,0,.25);
    display: grid; gap: 10px; font: 400 14px/1.4 system-ui, -apple-system, 'Segoe UI', sans-serif; color: #222; }
  .share-join h2 { margin: 0; font-size: 18px; }
  .share-join p { margin: 0; color: #555; }
  .share-join input { font: inherit; font-size: 16px; padding: 9px 11px; border: 1px solid #c9c9cf; border-radius: 8px; }
  .share-join button { font: 600 15px/1 system-ui, sans-serif; padding: 11px; border: 0; border-radius: 8px; background: #1f6f43; color: #fff; }
  .share-join.share-kicked { background: rgba(20, 20, 24, .85); }
  .share-chip { position: fixed; left: 12px; bottom: 12px; z-index: 99; max-width: min(420px, calc(100vw - 24px)); padding: 6px 12px;
    border-radius: 999px; background: #1f6f43; color: #fff; font: 600 12px/1.3 system-ui, sans-serif; box-shadow: 0 2px 8px rgba(0,0,0,.18); }
  .share-chip.bad { background: #8a2b1d; }
  .share-chip[hidden] { display: none; }
</style>
</head>
<body>
<p class="share-boot" id="share-boot">Connecting to the book…</p>
<script src="/guest.js"></script>
</body>
</html>
